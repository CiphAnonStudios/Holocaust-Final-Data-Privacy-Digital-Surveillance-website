<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>title</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

/* HERO  */
.hero { 
    background: url('https://images.unsplash.com/photo-1510511459019-5dda7724fd87') center/cover no-repeat;
    padding: 100px 20px;
    text-align: center;
}

.hero h1 {
    font-size: 50px;
    margin-bottom: 10px;
}

.hero p {
    font-size: 20px;
    color: #ddd;
}

/* SECTION */
.section {
    padding: 50px 20px;
    text-align: center;
    max-width: 1000px;
    margin: auto;
}

/* CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    background: #334155;
}

/* NAV BUTTONS */
.nav {
    margin-top: 30px;
}

.nav a {
    display: inline-block;
    margin: 10px;
    padding: 12px 20px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.nav a:hover {
    background: #1d4ed8;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    background: #020617;
    color: #aaa;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
    <h1>title</h1>
    <p>sub title</p>
</div>

<!-- INTRO -->
<div class="section">
    <h2>info</h2>
    <p>
        info...
    </p>
</div>

<!-- CARDS -->
<div class="section">
    <h2>cards</h2>

    <div class="cards">
        <div class="card">
            <h3>card 1</h3>
            <p>info</p>
        </div>

        <div class="card">
            <h3>card 2</h3>
            <p>info</p>
        </div>

        <div class="card">
            <h3>card 3</h3>
            <p>info</p>
        </div>

        <div class="card">
            <h3>card 4</h3>
            <p>info</p>
        </div>
    </div>
</div>

<!-- EXTRA INFO -->
<div class="section">
    <h2>extra fact</h2>
    <p>
       info
    </p>
</div>

<!-- NAV -->
<div class="section nav">
    <a href="#">page info 1</a>
    <a href="#">page info 2</a>
    <a href="#">page info 3</a>
    <a href="#">page info 4</a>
</div>

<!-- FOOTER -->
<footer>
    <p>footer</p>
</footer>

</body>
</html>
